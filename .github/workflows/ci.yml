name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright (pinned in package-lock.json)
        run: npm ci

      - name: Install Chromium for the browser suites
        run: npx playwright install --with-deps chromium

      - name: Generate test fixtures
        run: npm run fixtures

      - name: Rebuild the atlas and check the committed build is current
        run: |
          npm run build
          git diff --exit-code -- vancouver-boundary-atlas.html

      - name: Node suites
        run: npm run test:node

      - name: Browser suites
        run: npm run test:browser

      - name: Keep screenshots from a failed browser run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: shot-*.png
          if-no-files-found: ignore
